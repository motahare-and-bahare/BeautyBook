name: CI

on:
  push:
  pull_request:

jobs:
  backend-sqlite:
    # Default profile (ADR-0011): a local SQLite file, no database service required.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./beautybook.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Migrations
        run: |
          alembic upgrade head
          alembic check
          test -f beautybook.db
      - name: Tests
        run: pytest

  backend-postgresql:
    # Production profile: the only place where concurrency is claimed.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: beautybook_app
          POSTGRES_PASSWORD: beautybook_ci
          POSTGRES_DB: beautybook_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U beautybook_app -d beautybook_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://beautybook_app:beautybook_ci@127.0.0.1:5432/beautybook_test
      TEST_DATABASE_URL: postgresql+psycopg://beautybook_app:beautybook_ci@127.0.0.1:5432/beautybook_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
