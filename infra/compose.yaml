# Local PostgreSQL alternative for developers who do not install PostgreSQL natively.
# Start with: docker compose -f infra/compose.yaml up -d
# The host port 5432 conflicts with a natively installed PostgreSQL service; stop one first.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: beautybook
      POSTGRES_USER: beautybook_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - beautybook-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beautybook_app -d beautybook"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  beautybook-db:
